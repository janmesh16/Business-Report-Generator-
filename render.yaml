services:
  - type: web
    name: ledgerly
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_PATH
        value: /app/data/ledgerly.db
    disk:
      name: ledgerly-data
      mountPath: /app/data
      sizeGB: 1
